<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egloo</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <script src="../src/js/main.js" defer></script>
</head>

<body>
    <header class="header">
        <div class="header__container">

            <!-- Gruppo voci sinistra -->
            <div class="header__group header__group--left">
                <p class="header__item">identità</p>
                <p class="header__item">vini</p>
                <p class="header__item">devin cosmetica</p>
            </div>

            <!-- Logo centrale -->
            <div class="header__logo">
                <img src="path/to/logo.png" alt="Logo">
            </div>

            <!-- Gruppo voci destra -->
            <div class="header__group header__group--right">
                <p class="header__item">esperienza</p>
                <p class="header__item">gift card</p>
                <p class="header__item">store locator</p>
            </div>

            <!-- Pulsante cambio lingua -->
            <div class="header__language">
                <button type="button">IT</button>
            </div>

        </div>
    </header>


</body>

</html>
