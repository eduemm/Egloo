<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egloo</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <script src="./main.js" defer></script>
</head>

<body>
    <header class="header">
        <div class="header__container">

            <!-- Gruppo voci sinistra -->
            <div class="header__group header__group--left">
                <p class="header__item">IDENTITA'</p>
                <p class="header__item">VINI</p>
                <p class="header__item">DEVIN COSMETICA</p>
            </div>

            <!-- Logo centrale -->
            <div class="header__logo">
                <img src="../src/img/logo.png" alt="Logo">
            </div>

            <!-- Gruppo voci destra -->
            <div class="header__group header__group--right">
                <p class="header__item">ESPERIENZA</p>
                <p class="header__item">GIFT CARD</p>
                <p class="header__item">STORE LOCATOR</p>
            </div>

            <!-- Pulsante cambio lingua -->
            <div class="header__language">
                <button type="button">IT</button>
            </div>

        </div>
    </header>
</body>

</html>
